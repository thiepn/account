<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Manage your THIEPN Account identity, security, connected apps, cloud data, backups and privacy." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="canonical" href="https://account.thiepn.dev/" />
    <title>THIEPN Account</title>
    <script>
      (() => {
        const stored = localStorage.getItem("thiepn.account.theme") || "system";
        const dark = stored === "dark" || (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
