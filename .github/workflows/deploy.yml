name: Deploy Account

on:
  workflow_run:
    workflows: ["Account CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: account-production
  cancel-in-progress: false

jobs:
  preflight:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Check Pages production configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" != "200" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for this repository yet."
            exit 0
          fi
          cname="$(python -c 'import json; print((json.load(open("/tmp/pages.json")).get("cname") or ""))')"
          if [ "$cname" = "account.thiepn.dev" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Pages exists but the custom domain is not account.thiepn.dev (current: $cname)"
          fi

  build:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_ACCOUNT_SERVICE_MODE: real
      VITE_ACCOUNT_CANONICAL_ORIGIN: https://account.thiepn.dev
      VITE_SUPABASE_URL: https://hycegznamzjhwinegaai.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1rZzRPzfLMaAH5pIgCwIjA_19UPMIsR
      VITE_FINANCE_MCP_OAUTH_ENABLED: ${{ vars.VITE_FINANCE_MCP_OAUTH_ENABLED }}
    steps:
      - name: Resolve release SHA
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify production bundle
        run: |
          test -f dist/index.html
          if grep -R -n -E 'thiepn\.account\.mock|MockAccountService|scenario=|failure injection|Development defaults to MockAccountService|/dev/runtime|/dev/shell' dist >/dev/null 2>&1; then
            echo "Development/mock Account runtime leaked into release artifact"
            exit 1
          fi
          grep -R -q 'hycegznamzjhwinegaai.supabase.co' dist
          grep -R -q 'https://account.thiepn.dev' dist
      - name: Add release metadata and deterministic auth routes
        shell: bash
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/japanese/entry dist/oauth/consent dist/sso/probe
          cp dist/index.html dist/japanese/entry/index.html
          cp dist/index.html dist/oauth/consent/index.html
          cp dist/index.html dist/sso/probe/index.html
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          cat > dist/release.json <<EOF
          {
            "product": "THIEPN Account",
            "version": "$version",
            "commit": "${{ steps.release.outputs.sha }}",
            "serviceMode": "real",
            "canonicalOrigin": "https://account.thiepn.dev"
          }
          EOF
          sha256sum dist/index.html dist/release.json | sed 's#  dist/#  #' > dist/SHA256SUMS
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: [build, preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Account
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed release SHA
        env:
          CANONICAL_URL: https://account.thiepn.dev
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          base="${CANONICAL_URL%/}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 "$base/release.json" -o /tmp/release.json; then
              deployed="$(python -c 'import json; print(json.load(open("/tmp/release.json"))["commit"])')"
              if [ "$deployed" = "$EXPECTED_SHA" ]; then
                echo "Verified deployed SHA: $deployed"
                exit 0
              fi
              echo "Deployment is serving $deployed; waiting for $EXPECTED_SHA"
            fi
            sleep 5
          done
          echo "Canonical HTTPS release SHA could not be verified"
          exit 1


  live-smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify live Account renders
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const pageErrors = [];
          const consoleErrors = [];

          page.on("pageerror", error => pageErrors.push(String(error)));
          page.on("console", message => {
            if (message.type() === "error") consoleErrors.push(message.text());
          });

          const response = await page.goto("https://account.thiepn.dev/", {
            waitUntil: "networkidle",
            timeout: 30000,
          });

          if (!response || !response.ok()) {
            throw new Error(`Production HTML request failed: ${response?.status() ?? "no response"}`);
          }

          await page.waitForSelector("body", {state:"visible"});
          const bodyText = (await page.locator("body").innerText()).trim();

          if (!bodyText) throw new Error("Production page rendered an empty body");

          const signIn = page.getByRole("button", {name:"Continue with Google"});
          const overview = page.getByRole("heading", {name:"Overview", exact:true});
          const unavailable = page.getByRole("heading", {name:"THIEPN Account is temporarily unavailable."});

          const rendered =
            await signIn.isVisible().catch(()=>false) ||
            await overview.isVisible().catch(()=>false) ||
            await unavailable.isVisible().catch(()=>false);

          if (!rendered) {
            console.log("BODY TEXT:", bodyText.slice(0,2000));
            throw new Error("Production Account did not render a recognized application state");
          }

          if (pageErrors.length) {
            throw new Error("Production page errors:\n" + pageErrors.join("\n"));
          }

          const relevantConsoleErrors = consoleErrors.filter(line =>
            !line.includes("favicon") && !line.includes("net::ERR_BLOCKED_BY_CLIENT")
          );
          if (relevantConsoleErrors.length) {
            throw new Error("Production console errors:\n" + relevantConsoleErrors.join("\n"));
          }

          console.log("Production Account rendered successfully:", bodyText.slice(0,500));

          for (const route of ["/oauth/consent", "/sso/probe"]) {
            const routePage = await browser.newPage();
            const routeResponse = await routePage.goto("https://account.thiepn.dev" + route, {
              waitUntil: "networkidle",
              timeout: 30000,
            });
            if (!routeResponse || routeResponse.status() !== 200) {
              throw new Error(`Account route ${route} did not return 200: ${routeResponse?.status() ?? "no response"}`);
            }
            await routePage.close();
          }

          const japaneseEntry = await browser.newPage();
          const japaneseEntryResponse = await japaneseEntry.goto("https://account.thiepn.dev/japanese/entry", {
            waitUntil: "networkidle",
            timeout: 30000,
          });
          if (!japaneseEntryResponse || japaneseEntryResponse.status() !== 200) {
            throw new Error(`Japanese Account entry did not return 200: ${japaneseEntryResponse?.status() ?? "no response"}`);
          }
          const invalidJapaneseRequest = japaneseEntry.getByRole("heading", {name:"This Japanese sign-in request is invalid.", exact:true});
          if (!(await invalidJapaneseRequest.isVisible().catch(()=>false))) {
            throw new Error("Japanese Account entry route did not render its expected boundary.");
          }
          await japaneseEntry.close();

          if (await signIn.isVisible().catch(()=>false)) {
            const requestPromise = page.waitForRequest(request =>
              request.url().includes("hycegznamzjhwinegaai.supabase.co/auth/v1/authorize"),
              {timeout:10000},
            );

            await signIn.click();
            const authorizeRequest = await requestPromise;
            const authorizeUrl = authorizeRequest.url();
            const parsed = new URL(authorizeUrl);

            if (parsed.searchParams.get("provider") !== "google") {
              throw new Error("Production OAuth did not request the Google provider");
            }

            const redirectTo = parsed.searchParams.get("redirect_to");
            if (redirectTo !== "https://account.thiepn.dev/auth/callback") {
              throw new Error(`Production OAuth redirect mismatch: ${redirectTo}`);
            }

            console.log("Production Google OAuth initiation verified:", authorizeUrl);
          }

          await browser.close();
          NODE
