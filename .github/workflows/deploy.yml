name: Deploy Account

on:
  workflow_run:
    workflows: ["Account CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: account-production
  cancel-in-progress: false

jobs:
  preflight:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Check Pages production configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code="$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$code" != "200" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for this repository yet."
            exit 0
          fi
          cname="$(python -c 'import json; print((json.load(open("/tmp/pages.json")).get("cname") or ""))')"
          if [ "$cname" = "account.thiepn.dev" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Pages exists but the custom domain is not account.thiepn.dev (current: $cname)"
          fi

  build:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_ACCOUNT_SERVICE_MODE: real
      VITE_ACCOUNT_CANONICAL_ORIGIN: https://account.thiepn.dev
      VITE_SUPABASE_URL: https://hycegznamzjhwinegaai.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1rZzRPzfLMaAH5pIgCwIjA_19UPMIsR
    steps:
      - name: Resolve release SHA
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify production bundle
        run: |
          test -f dist/index.html
          if grep -R -n -E 'thiepn\.account\.mock|MockAccountService|scenario=|failure injection|Development defaults to MockAccountService|/dev/runtime|/dev/shell' dist >/dev/null 2>&1; then
            echo "Development/mock Account runtime leaked into release artifact"
            exit 1
          fi
          grep -R -q 'hycegznamzjhwinegaai.supabase.co' dist
          grep -R -q 'https://account.thiepn.dev' dist
      - name: Add release metadata and SPA deep-link fallback
        shell: bash
        run: |
          cp dist/index.html dist/404.html
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          cat > dist/release.json <<EOF
          {
            "product": "THIEPN Account",
            "version": "$version",
            "commit": "${{ steps.release.outputs.sha }}",
            "serviceMode": "real",
            "canonicalOrigin": "https://account.thiepn.dev"
          }
          EOF
          sha256sum dist/index.html dist/release.json > dist/SHA256SUMS
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: [build, preflight]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Account
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed release SHA
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          base="${PAGE_URL%/}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$base/release.json" -o /tmp/release.json; then
              deployed="$(python -c 'import json; print(json.load(open("/tmp/release.json"))["commit"])')"
              if [ "$deployed" = "$EXPECTED_SHA" ]; then
                echo "Verified deployed SHA: $deployed"
                exit 0
              fi
              echo "Deployment is serving $deployed; waiting for $EXPECTED_SHA"
            fi
            sleep 5
          done
          echo "Live release SHA could not be verified"
          exit 1
