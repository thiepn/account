name: Register THIEPN Library OAuth Client

on:
  push:
    branches: [first-party-sso-v2]
    paths:
      - ".github/workflows/register-library-oauth-client-once.yml"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register public OAuth client
        shell: bash
        env:
          DISCOVERY_URL: https://hycegznamzjhwinegaai.supabase.co/.well-known/oauth-authorization-server/auth/v1
        run: |
          set -euo pipefail
          node <<'NODE'
          const discoveryUrl = process.env.DISCOVERY_URL;
          if (!discoveryUrl) throw new Error("DISCOVERY_URL missing");

          const discoveryResponse = await fetch(discoveryUrl, {
            redirect: "error",
            signal: AbortSignal.timeout(10_000),
          });
          if (!discoveryResponse.ok) {
            throw new Error(`OAuth discovery failed: ${discoveryResponse.status}`);
          }
          const metadata = await discoveryResponse.json();
          if (
            typeof metadata.registration_endpoint !== "string" ||
            !metadata.registration_endpoint.startsWith("https://")
          ) {
            throw new Error("Dynamic registration endpoint is unavailable");
          }

          const redirectUri = "https://thiepn.dev/library/auth/callback/";
          const body = {
            client_name: "THIEPN Library",
            client_uri: "https://thiepn.dev/library/",
            redirect_uris: [redirectUri],
            token_endpoint_auth_method: "none",
            grant_types: ["authorization_code", "refresh_token"],
            response_types: ["code"],
            scope: "openid email profile offline_access",
          };

          const response = await fetch(metadata.registration_endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            redirect: "error",
            signal: AbortSignal.timeout(10_000),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(
              `Dynamic client registration failed: ${response.status} ${JSON.stringify(payload)}`,
            );
          }

          if (
            typeof payload.client_id !== "string" ||
            !/^[0-9a-f-]{36}$/i.test(payload.client_id)
          ) {
            throw new Error("Registration did not return a valid client_id");
          }
          if (
            payload.token_endpoint_auth_method !== "none" ||
            !Array.isArray(payload.redirect_uris) ||
            payload.redirect_uris.length !== 1 ||
            payload.redirect_uris[0] !== redirectUri
          ) {
            throw new Error("Registered client does not match the expected public-client contract");
          }

          console.log(`THIEPN_LIBRARY_OAUTH_CLIENT_ID=${payload.client_id}`);
          console.log("THIEPN Library public OAuth client registration passed");
          NODE
