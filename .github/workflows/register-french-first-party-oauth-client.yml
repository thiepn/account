name: Register French first-party OAuth client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register exactly one French public OAuth client
        shell: bash
        env:
          ACCOUNT_ORIGIN: https://hycegznamzjhwinegaai.supabase.co
          EXPECTED_REGISTRATION_ENDPOINT: https://hycegznamzjhwinegaai.supabase.co/auth/v1/oauth/clients/register
          CLIENT_NAME: THIEPN French
          CLIENT_URI: https://french.thiepn.dev/
          REDIRECT_URI: https://french.thiepn.dev/
        run: |
          set -euo pipefail
          node <<'NODE'
          import { appendFile } from "node:fs/promises";

          const origin = process.env.ACCOUNT_ORIGIN;
          const expectedEndpoint = process.env.EXPECTED_REGISTRATION_ENDPOINT;
          const clientName = process.env.CLIENT_NAME;
          const clientUri = process.env.CLIENT_URI;
          const redirectUri = process.env.REDIRECT_URI;

          const discoveryUrl =
            origin + "/.well-known/oauth-authorization-server/auth/v1";
          const discoveryResponse = await fetch(discoveryUrl, {
            redirect: "error",
            signal: AbortSignal.timeout(10_000),
          });
          if (!discoveryResponse.ok) {
            throw new Error(
              `OAuth discovery failed: ${discoveryResponse.status}`,
            );
          }
          const metadata = await discoveryResponse.json();
          const endpoint = metadata.registration_endpoint;
          if (endpoint !== expectedEndpoint) {
            throw new Error(`Unexpected registration endpoint: ${endpoint}`);
          }

          const registrationResponse = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              client_name: clientName,
              client_uri: clientUri,
              redirect_uris: [redirectUri],
              grant_types: ["authorization_code", "refresh_token"],
              response_types: ["code"],
              token_endpoint_auth_method: "none",
            }),
            redirect: "error",
            signal: AbortSignal.timeout(10_000),
          });

          const body = await registrationResponse.text();
          let result;
          try {
            result = body ? JSON.parse(body) : {};
          } catch {
            throw new Error(
              `OAuth registration returned non-JSON: ${registrationResponse.status}`,
            );
          }
          if (!registrationResponse.ok) {
            throw new Error(
              `OAuth registration failed: ${registrationResponse.status} ${body.slice(0, 500)}`,
            );
          }

          const clientId = result.client_id;
          const returnedName = result.client_name ?? result.name;
          const returnedRedirects = result.redirect_uris;
          const authMethod = result.token_endpoint_auth_method;

          if (
            typeof clientId !== "string" ||
            !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
              clientId,
            )
          ) {
            throw new Error("Registration returned an invalid client UUID.");
          }
          if (returnedName !== clientName) {
            throw new Error("Client name mismatch.");
          }
          if (
            !Array.isArray(returnedRedirects) ||
            returnedRedirects.length !== 1 ||
            returnedRedirects[0] !== redirectUri
          ) {
            throw new Error("Exact French callback mismatch.");
          }
          if (authMethod !== "none") {
            throw new Error(
              "French must be a public OAuth client with token_endpoint_auth_method=none.",
            );
          }
          if (
            typeof result.client_secret === "string" &&
            result.client_secret.length > 0
          ) {
            throw new Error(
              "Public French OAuth client unexpectedly returned a client secret.",
            );
          }

          console.log(
            `::notice title=French OAuth client ID::${clientId}`,
          );
          await appendFile(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## French first-party OAuth registration",
              "",
              `- Client ID: \`${clientId}\``,
              `- Client name: \`${returnedName}\``,
              `- Client URI: \`${clientUri}\``,
              `- Callback: \`${returnedRedirects[0]}\``,
              `- Token auth: \`${authMethod}\``,
              "",
              "Next: pin this UUID in Account's `account_first_party_oauth_clients` registry, update French's pending client constant, verify the SSO probe, then delete this branch.",
              "",
            ].join("\n"),
          );
          NODE
