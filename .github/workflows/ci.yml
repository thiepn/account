name: Account CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: account-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Commit generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is already tracked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Lock Account release dependencies"
          git push
      - run: pnpm typecheck
      - name: Enforce frontend backend-boundary imports
        run: |
          if grep -R -n -E '@supabase/supabase-js|supabase\.|fetch\(|axios' src/pages src/components src/account/hooks.ts src/account/useSensitiveAction.ts; then
            echo "Direct backend access found outside the Account service adapter"
            exit 1
          fi
      - run: pnpm test
      - run: pnpm build
      - name: Assert production build contains no development Account runtime
        run: |
          if grep -R -n -E 'thiepn\.account\.mock|MockAccountService|scenario=|failure injection|Development defaults to MockAccountService|/dev/runtime|/dev/shell' dist >/dev/null 2>&1; then
            echo "Development/mock Account runtime leaked into production assets"
            grep -R -n -E 'thiepn\.account\.mock|MockAccountService|scenario=|failure injection|Development defaults to MockAccountService|/dev/runtime|/dev/shell' dist || true
            exit 1
          fi
      - name: Enforce Supabase adapter isolation
        run: |
          matches="$(grep -R -l -E '@supabase/supabase-js|createClient\(' src --include='*.ts' --include='*.tsx' || true)"
          allowed="src/account/api/supabase.ts"
          for file in $matches; do
            if [ "$file" != "$allowed" ]; then
              echo "Supabase client import/creation outside the approved adapter: $file"
              exit 1
            fi
          done

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
